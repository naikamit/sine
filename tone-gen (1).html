<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tone Generator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700&display=swap');

  :root {
    --bg: #0a0a0a;
    --surface: #111;
    --border: #1e1e1e;
    --accent: #00ff88;
    --accent-dim: #00ff8833;
    --text: #c8c8c8;
    --text-dim: #444;
    --glow: 0 0 20px #00ff8855;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,255,136,0.015) 2px,
      rgba(0,255,136,0.015) 4px
    );
    pointer-events: none;
  }

  .container {
    width: 360px;
    padding: 40px 36px;
    border: 1px solid var(--border);
    background: var(--surface);
    position: relative;
  }

  .container::before, .container::after {
    content: '';
    position: absolute;
    width: 12px; height: 12px;
    border-color: var(--accent);
    border-style: solid;
  }
  .container::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
  .container::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

  h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 32px;
    opacity: 0.85;
  }

  label {
    display: block;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .hz-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 6px;
  }

  input[type="number"] {
    flex: 1;
    background: transparent;
    border: none;
    border-bottom: 1px solid #2a2a2a;
    color: var(--accent);
    font-family: 'Orbitron', sans-serif;
    font-size: 36px;
    font-weight: 700;
    padding: 4px 0;
    outline: none;
    width: 100%;
    transition: border-color 0.2s;
    -moz-appearance: textfield;
  }
  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
  input[type="number"]:focus { border-bottom-color: var(--accent); }

  .unit { font-size: 14px; color: var(--text-dim); letter-spacing: 0.1em; }

  #freq-slider {
    margin: 12px 0 4px;
  }

  .freq-range-row {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--text-dim);
    margin-bottom: 24px;
  }

  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 2px;
    background: var(--border);
    outline: none;
    margin: 20px 0 6px;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: var(--glow);
    transition: transform 0.1s;
  }
  input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.3); }

  .vol-row {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--text-dim);
    margin-bottom: 28px;
  }

  #vol-val { color: var(--text); }

  .divider {
    height: 1px;
    background: var(--border);
    margin-bottom: 28px;
  }

  button {
    width: 100%;
    padding: 14px;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s, box-shadow 0.15s;
    position: relative;
    overflow: hidden;
  }

  button:hover {
    background: var(--accent-dim);
    box-shadow: var(--glow);
  }

  button.playing {
    background: var(--accent);
    color: #000;
    box-shadow: var(--glow), 0 0 40px #00ff8844;
  }

  /* waveform vis */
  canvas {
    display: block;
    width: 100%;
    height: 48px;
    margin-bottom: 28px;
    opacity: 0.6;
  }

  .status {
    text-align: center;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--text-dim);
    margin-top: 20px;
    height: 14px;
    transition: color 0.2s;
  }
  .status.on { color: var(--accent); }
</style>
</head>
<body>

<div class="container">
  <h1>Sine Tone Generator</h1>

  <label>Frequency</label>
  <div class="hz-row">
    <input type="number" id="freq" value="440" min="20" max="20000" step="1">
    <span class="unit">Hz</span>
  </div>

  <input type="range" id="freq-slider" min="20" max="20000" value="440" step="1">
  <div class="freq-range-row">
    <span>20 Hz</span>
    <span>20 kHz</span>
  </div>

  <label>Volume</label>
  <input type="range" id="vol" min="0" max="100" value="50">
  <div class="vol-row">
    <span>0</span>
    <span id="vol-val">50%</span>
    <span>100</span>
  </div>

  <canvas id="wave" width="288" height="48"></canvas>

  <div class="divider"></div>

  <button id="btn">▶ &nbsp; Play</button>
  <div class="status" id="status">— stopped —</div>
</div>

<script>
  let ctx, osc, gain, animId;
  let playing = false;

  const freqEl     = document.getElementById('freq');
  const freqSlider = document.getElementById('freq-slider');
  const volEl  = document.getElementById('vol');
  const btn    = document.getElementById('btn');
  const status = document.getElementById('status');
  const volVal = document.getElementById('vol-val');
  const canvas = document.getElementById('wave');
  const cx     = canvas.getContext('2d');

  canvas.width  = canvas.offsetWidth * devicePixelRatio;
  canvas.height = canvas.offsetHeight * devicePixelRatio;
  cx.scale(devicePixelRatio, devicePixelRatio);
  const W = canvas.offsetWidth, H = canvas.offsetHeight;

  function drawIdle() {
    cx.clearRect(0, 0, W, H);
    cx.strokeStyle = '#1e1e1e';
    cx.lineWidth = 1;
    cx.beginPath();
    cx.moveTo(0, H/2); cx.lineTo(W, H/2);
    cx.stroke();
  }
  drawIdle();

  function drawWave() {
    const hz = parseFloat(freqEl.value) || 440;
    const t  = performance.now() / 1000;
    cx.clearRect(0, 0, W, H);

    // grid line
    cx.strokeStyle = '#1a1a1a';
    cx.lineWidth = 1;
    cx.beginPath(); cx.moveTo(0, H/2); cx.lineTo(W, H/2); cx.stroke();

    // sine
    const cycles = Math.min(Math.max(hz / 100, 1.5), 8);
    cx.strokeStyle = '#00ff88';
    cx.lineWidth = 1.5;
    cx.shadowColor = '#00ff88';
    cx.shadowBlur = 6;
    cx.beginPath();
    for (let x = 0; x <= W; x++) {
      const phase = (x / W) * cycles * Math.PI * 2 + t * 2;
      const y = H/2 - Math.sin(phase) * (H/2 - 4);
      x === 0 ? cx.moveTo(x, y) : cx.lineTo(x, y);
    }
    cx.stroke();
    cx.shadowBlur = 0;

    animId = requestAnimationFrame(drawWave);
  }

  function start() {
    ctx  = new (window.AudioContext || window.webkitAudioContext)();
    osc  = ctx.createOscillator();
    gain = ctx.createGain();

    osc.type = 'sine';
    osc.frequency.value = parseFloat(freqEl.value) || 440;
    gain.gain.value = parseInt(volEl.value) / 100 * 0.8;

    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();

    playing = true;
    btn.textContent = '■ \u00a0 Stop';
    btn.classList.add('playing');
    status.textContent = `${osc.frequency.value} Hz — playing`;
    status.classList.add('on');
    drawWave();
  }

  function stop() {
    if (osc)  { osc.stop(); osc.disconnect(); }
    if (gain) { gain.disconnect(); }
    if (ctx)  { ctx.close(); }
    cancelAnimationFrame(animId);
    drawIdle();

    playing = false;
    btn.textContent = '▶ \u00a0 Play';
    btn.classList.remove('playing');
    status.textContent = '— stopped —';
    status.classList.remove('on');
  }

  btn.addEventListener('click', () => playing ? stop() : start());

  freqEl.addEventListener('input', () => {
    const v = parseFloat(freqEl.value) || 440;
    freqSlider.value = v;
    if (osc) osc.frequency.value = v;
    if (playing) status.textContent = `${freqEl.value} Hz — playing`;
  });

  freqSlider.addEventListener('input', () => {
    const v = parseInt(freqSlider.value);
    freqEl.value = v;
    if (osc) osc.frequency.value = v;
    if (playing) status.textContent = `${v} Hz — playing`;
  });

  volEl.addEventListener('input', () => {
    const v = parseInt(volEl.value);
    volVal.textContent = v + '%';
    if (gain) gain.gain.value = v / 100 * 0.8;
  });
</script>
</body>
</html>
